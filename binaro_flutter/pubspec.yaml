publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  cupertino_icons: ^1.0.8
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.3
  youtube_player_flutter: ^10.0.1
  webview_flutter_platform_interface: ^2.15.1
