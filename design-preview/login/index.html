<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preview Design Login — Binaro</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Plus Jakarta Sans', 'Segoe UI', sans-serif; background: #0B2A44; min-height: 100vh; display: flex; flex-direction: column; }
    header { padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    header .t { color: #fff; font-size: 15px; font-weight: 800; }
    header .t small { display: block; font-size: 11.5px; color: rgba(255,255,255,.6); font-weight: 600; margin-top: 2px; }
    .switcher { display: flex; gap: 8px; flex-wrap: wrap; }
    .switcher button {
        font: inherit; font-size: 12.5px; font-weight: 800;
        color: rgba(255,255,255,.85);
        background: rgba(255,255,255,.10);
        border: 1px solid rgba(255,255,255,.25);
        border-radius: 999px;
        padding: 9px 18px;
        cursor: pointer;
        transition: all .15s;
    }
    .switcher button:hover { background: rgba(255,255,255,.2); }
    .switcher button.active { background: #fff; color: #13527D; border-color: #fff; }
    iframe { flex: 1; width: 100%; border: none; background: #F8FAFC; }
    .hint { color: rgba(255,255,255,.5); font-size: 11px; padding: 0 24px 10px; }
</style>
</head>
<body>
    <header>
        <div class="t">Preview Design Halaman Login — Binaro
            <small>Pilih varian di bawah untuk melihat. Semua memakai design system aplikasi (biru #13527D, Plus Jakarta Sans, kartu rounded).</small>
        </div>
        <div class="switcher">
            <button data-src="varian-a.html" class="active">A — Split Biru Elegan</button>
            <button data-src="varian-b.html">B — Canvas Terang Sentris</button>
            <button data-src="varian-c.html">C — Kartu Ganda Premium</button>
        </div>
    </header>
    <div class="hint">Buka file varian-*.html langsung di browser juga bisa. Ini hanya mockup statis — belum diimplementasi ke Blade.</div>
    <iframe id="frame" src="varian-a.html" title="Preview varian"></iframe>
<script>
    const frame = document.getElementById('frame');
    document.querySelectorAll('.switcher button').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.switcher button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            frame.src = btn.dataset.src;
        });
    });
</script>
</body>
</html>
